<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultaten</title>
  <link rel="stylesheet" href="./style.css">
  <meta name="theme-color" content="#003399">
</head>
<body>
  <header class="top">
    <h1>Resultaten</h1>
    <span id="avg-score" class="header-badge">-- /20</span>
    <div class="stripe"></div>
  </header>
  <main>
    <div class="filter-row">
      <div class="filter-group">
        <label for="year-filter">Academisch jaar</label>
        <select id="year-filter" aria-label="Filter op academisch jaar">
          <option value="">Alle jaren</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="semester-filter">Semester</label>
        <select id="semester-filter" aria-label="Filter op semester">
          <option value="">Alle semesters</option>
        </select>
      </div>
    </div>

    <input
      type="text"
      id="score-search"
      class="search-box"
      placeholder="Zoek een vak..."
      aria-label="Zoek vakken"
    >

    <div id="no-results" class="empty-msg" style="display:none;">
      Niets teruggevonden.
    </div>

    <div id="results-list">
      <div class="empty-msg">Laden...</div>
    </div>
  </main>

  <script src="./script.js"></script>
  <script>
    setupSearch('score-search', '.score-item', 'no-results');
    loadResultsList('https://drive.google.com/uc?export=download&id=1Z_XoqS-azqVL7QWRIhtzjZq4gIjC8r7L', 'results-list');
  </script>
</body>
</html>
